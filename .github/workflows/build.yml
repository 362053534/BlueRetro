name: build
on:
  push:
    branches: [ fengge-v26.09, 'arena/**' ]
  pull_request:
    branches: [ fengge-v26.09, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        hw_version: [hw1]
        br_config:
          [playstation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/darthcloud/idf-blueretro:v5.5.0_2024-12-02
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      IDF_CCACHE_ENABLE: "1"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.hw_version }}-${{ matrix.br_config }}-${{ hashFiles('sdkconfig.defaults', format('configs/{0}/{1}', matrix.hw_version, matrix.br_config)) }}
        restore-keys: |
          ccache-${{ matrix.hw_version }}-${{ matrix.br_config }}-
    - name: Build with ESP-IDF
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        rm -fr build
        echo "FengGe_V2 ${{ matrix.br_config }}" | cut -c -31 > version.txt
        cat version.txt
        cp configs/${{ matrix.hw_version }}/${{ matrix.br_config }} sdkconfig
        ccache -z 2>/dev/null || true
        BR_HW=_${{ matrix.hw_version }} BR_SYS=_${{ matrix.br_config }} idf.py reconfigure build
        ccache -s 2>/dev/null || true
    - name: Copy OTA initial binary
      working-directory: ./build
      run: |
        mkdir ota
        mv ota_data_initial.bin ota/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.hw_version }}_${{ matrix.br_config }}
        path: |
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          build/ota/ota_data_initial.bin
          build/BlueRetro*.bin
        if-no-files-found: error
